# Build & publish Assignment 2 images to Docker Hub + GitHub Container Registry.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  e.g. sarshiak
#   DOCKERHUB_TOKEN     Docker Hub access token (Read & Write)
#
# GHCR uses the built-in GITHUB_TOKEN (enable package write in workflow permissions).

name: Publish Assignment 2 images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "2/bank_server/**"
      - "2/gateway/**"
      - "2/coordinator/**"
      - "2/console/**"
      - "2/migrator/**"
      - "2/healer/**"
      - ".github/workflows/publish-images.yml"

env:
  # Keep names short for Docker Hub free repos; GHCR uses the same suffix under ghcr.io/<owner>/...
  CONTEXT_ROOT: "2"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bank-server
            context: 2/bank_server
            hub_repo: ds2-bank-server
          - name: gateway
            context: 2/gateway
            hub_repo: ds2-gateway
          - name: coordinator
            context: 2/coordinator
            hub_repo: ds2-coordinator
          - name: console
            context: 2/console
            hub_repo: ds2-console
          - name: migrator
            context: 2/migrator
            hub_repo: ds2-migrator
          - name: healer
            context: 2/healer
            hub_repo: ds2-healer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          OWNER_LC='${{ github.repository_owner }}'
          OWNER_LC="${OWNER_LC,,}"
          HUB_USER='${{ secrets.DOCKERHUB_USERNAME }}'
          if [ -z "$HUB_USER" ]; then
            echo "DOCKERHUB_USERNAME secret is missing" >&2
            exit 1
          fi
          TAG=latest
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_SHA}" != "" ]]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          GHCR="ghcr.io/${OWNER_LC}/distributed-systems/${{ matrix.name }}"
          HUB="${HUB_USER}/${{ matrix.hub_repo }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"
          echo "hub=${HUB}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.name }} as:"
          echo "  ${GHCR}:${TAG} and ${GHCR}:latest"
          echo "  ${HUB}:${TAG} and ${HUB}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.hub }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
