# Build & publish Assignment 2 images to GitHub Container Registry (ghcr.io).
# No Docker Hub secrets needed — uses GITHUB_TOKEN with packages: write.

name: Publish Assignment 2 images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "2/bank_server/**"
      - "2/gateway/**"
      - "2/coordinator/**"
      - "2/console/**"
      - "2/migrator/**"
      - "2/healer/**"
      - ".github/workflows/publish-images.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bank-server
            context: 2/bank_server
          - name: gateway
            context: 2/gateway
          - name: coordinator
            context: 2/coordinator
          - name: console
            context: 2/console
          - name: migrator
            context: 2/migrator
          - name: healer
            context: 2/healer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          OWNER_LC='${{ github.repository_owner }}'
          OWNER_LC="${OWNER_LC,,}"
          TAG=latest
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_SHA}" != "" ]]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          GHCR="ghcr.io/${OWNER_LC}/distributed-systems/${{ matrix.name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ matrix.name }} -> ${GHCR}:${TAG} (+ latest)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ghcr }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
