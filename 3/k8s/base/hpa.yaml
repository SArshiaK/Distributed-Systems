apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-a
  namespace: banking
  labels:
    app: bank-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-a
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
