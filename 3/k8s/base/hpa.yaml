    app: bank-b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-b
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
