apiVersion: v1
kind: Service
metadata:
  name: bank-a
  namespace: banking
  labels:
    app: bank-a
    shard: A
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: bank-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-a
  namespace: banking
  labels:
    app: bank-a
    shard: A
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-a
  template:
    metadata:
      labels:
        app: bank-a
        shard: A
        tier: app
    spec:
      containers:
        - name: bank
          image: 2-bank-a1:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL_A
            - name: SHARD_ID
              value: "A"
            - name: OWNED_START
              value: "1"
            - name: OWNED_END
              value: "1000"
            - name: WRITES_ENABLED
              value: "true"
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
