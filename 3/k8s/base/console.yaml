apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: banking
  labels:
    app: console
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30330
  selector:
    app: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: banking
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
        tier: edge
    spec:
      containers:
        - name: console
          image: 2-console:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_URL
              value: http://gateway:8080
            - name: COORDINATOR_URL
              value: http://coordinator:8090
            - name: DB_A_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL_A
            - name: DB_B_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL_B
            - name: DB_COORD_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL_COORD
            - name: SHARD_MAP_PATH
              value: /config/shard_map.json
          volumeMounts:
            - name: shard-map
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: shard-map
          configMap:
            name: shard-map
