apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: banking
  labels:
    app: coordinator
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app: coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: banking
  labels:
    app: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
        tier: app
    spec:
      containers:
        - name: coordinator
          image: 2-coordinator:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL_COORD
            - name: SHARD_MAP_PATH
              value: /config/shard_map.json
            - name: FAULT_DIR
              value: /faults
          volumeMounts:
            - name: shard-map
              mountPath: /config
              readOnly: true
            - name: faults
              mountPath: /faults
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: shard-map
          configMap:
            name: shard-map
        - name: faults
          emptyDir: {}
