apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking
  labels:
    app: gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: edge
    spec:
      containers:
        - name: gateway
          image: 2-gateway:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SHARD_MAP_PATH
              value: /config/shard_map.json
            - name: COORDINATOR_URL
              value: http://coordinator:8090
            - name: HEALTH_INTERVAL
              value: "2"
          volumeMounts:
            - name: shard-map
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: shard-map
          configMap:
            name: shard-map
