# GHCR overlay — does NOT replace local compose.
#
# Local (unchanged):
#   docker compose up -d --build
#   docker compose --profile bonus up -d --build
#
# From GitHub Container Registry:
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml --profile bonus up -d --no-build
#
# Optional: copy .env.images.example → .env to override image names.

services:
  bank-a1:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  bank-a2:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  bank-b1:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  bank-b2:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  bank-c1:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  bank-c2:
    image: ${BANK_IMAGE:-ghcr.io/sarshiak/distributed-systems/bank-server:latest}
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/sarshiak/distributed-systems/gateway:latest}
  coordinator:
    image: ${COORDINATOR_IMAGE:-ghcr.io/sarshiak/distributed-systems/coordinator:latest}
  console:
    image: ${CONSOLE_IMAGE:-ghcr.io/sarshiak/distributed-systems/console:latest}
  migrator:
    image: ${MIGRATOR_IMAGE:-ghcr.io/sarshiak/distributed-systems/migrator:latest}
  healer:
    image: ${HEALER_IMAGE:-ghcr.io/sarshiak/distributed-systems/healer:latest}
